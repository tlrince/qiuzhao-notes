# Nginx server-block sample for the Vite SPA. Set `root` to the directory that
# contains the contents of web-dist/. Configure listen/server_name and HTTPS in
# the deployment environment.
server {
    root /var/www/autumn-notes;
    index index.html;

    # Keep the HTML entry fresh so clients discover the newest hashed bundle.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits assets using [name]-[8 character hash].[extension]. Do not
    # cache a missing asset for a year: add_header without `always` only applies
    # to successful responses and redirects.
    location ~* ^/assets/.+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Existing unhashed assets are served normally; missing assets are real 404s.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # A missing file-like URL is not an SPA route and must not receive index.html.
    location ~* \.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # BrowserRouter deep links (for example /analytics) use the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
